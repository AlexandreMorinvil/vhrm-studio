[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vhrm-studio"
version = "0.2.0"
description = "vHRM Studio: converts rPPG video datasets into skin-UV HDF5 files (PEAR SMPL-X UV mapping + DeepLabV3+ skin segmentation) and views them"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22,<2",
    "h5py>=3.8",
    "opencv-python>=4.7",
    "PySide6>=6.5,<6.10",
    "pyqtgraph>=0.13.3",
    "av>=11",
]

[project.optional-dependencies]
# Dataset conversion and mesh views. Also needed, installed separately (see README): a CUDA build of torch and
# torchvision, PyTorch3D, chumpy (pip install chumpy --no-build-isolation) and ffmpeg / ffprobe.
pipeline = [
    "onnxruntime-gpu>=1.17",
    "ultralytics>=8.1",
    "huggingface_hub>=0.20",
    "omegaconf>=2.3",
    "timm>=0.9",
    "einops>=0.7",
    "PyYAML>=6",
    "scipy>=1.10",
]

[project.scripts]
vhrm-studio = "vhrm_studio.app:main"
vhrm-studio-convert = "vhrm_studio.convert:main"

[project.gui-scripts]
vhrm-studio-gui = "vhrm_studio.app:main"  # same app without a console window

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vhrm_studio = [
    "pipeline/data/*.npz",
    "pipeline/data/*.onnx",
    "third_party/pear/LICENSE.txt",
    "third_party/pear/NOTICE.md",
    "third_party/pear/configs/*.yaml",
    "third_party/pear/data/*.npz",
]
